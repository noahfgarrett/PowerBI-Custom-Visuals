<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QCx Overview preview</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: repeating-conic-gradient(#e6e6e6 0% 25%, #ffffff 0% 50%) 0 0 / 20px 20px;
        font-family: system-ui, sans-serif;
      }
      #frame {
        position: relative;
        overflow: hidden;
        outline: 1px dashed #9aa4b2;
      }
      #tooltip {
        position: fixed;
        z-index: 10;
        display: none;
        padding: 8px 10px;
        border-radius: 8px;
        background: #1b2530;
        color: #fff;
        font-size: 11.5px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="frame"></div>
    <div id="tooltip"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
