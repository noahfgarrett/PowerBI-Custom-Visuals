<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SSM Explorer — Actual Visual QA</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font: 13px system-ui, sans-serif; background: #e9eef0; color: #233d46; }
        .harness-controls { display: flex; gap: 12px; align-items: center; padding: 10px 20px; min-height: 50px; flex-wrap: wrap; }
        .harness-controls label { display: flex; align-items: center; gap: 5px; }
        .harness-controls button, .harness-controls select { font: inherit; padding: 5px 9px; }
        #visual { position: relative; width: 1280px; height: 720px; margin: 16px auto; background: white; overflow: hidden; box-shadow: 0 3px 24px #18383a14; }
    </style>
</head>
<body>
    <div class="harness-controls" aria-label="Synthetic test harness">
        <strong>Actual Power BI Visual · synthetic data</strong>
        <label>Viewport <select id="size"><option value="1280x720">1280 × 720</option><option value="800x600">800 × 600</option><option value="420x620">420 × 620</option><option value="320x280">320 × 280</option></select></label>
        <label>Dataset <select id="dataset"><option value="standard">Multi-project</option><option value="wide">Wide graph · 600 equipment</option><option value="hierarchy">Nested hierarchy · 240 milestones per parent</option><option value="structural">Structural parents · direct dependencies</option><option value="showroom">East Plant · asset tree and status</option><option value="scale-10000">Scale · 10,000 equipment</option><option value="scale-50000">Scale · 50,000 equipment</option><option value="scale-100000">Scale · 100,000 equipment</option><option value="empty">Empty data</option><option value="partial">Partial data</option></select></label>
        <label><input type="checkbox" id="high-contrast" /> High contrast</label>
        <button id="refresh">Metadata refresh</button>
    </div>
    <main id="visual" aria-label="Actual SSM Explorer"></main>
    <script type="module" src="/main.ts"></script>
</body>
</html>
