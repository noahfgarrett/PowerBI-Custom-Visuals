name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests
        run: npx vitest run --project '!qaqc-shared-timing' --testTimeout=60000

  # Wall-clock budgets for sorting and filtering large issue tables. Shared runners
  # vary a lot in speed, so these report but don't block.
  timing:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --project qaqc-shared-timing
